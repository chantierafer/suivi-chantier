<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#2E3238">
<title>Mes missions · AFER</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icone-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Manrope:wght@400;500;600;700;800&display=swap">
<!-- Espace ouvrier (V16, 05/11/2026) : un lien par personne (?o=…), créé dans Gestion > Personnel et matériel.
     Lit la fonction Supabase espace_ouvrier (supabase/complement-v16-ouvriers.sql) : ses jours du planning, sans aucun prix. -->
<style>
:root{--turq:#2FBFBF;--turq-ink:#178C8C;--turq-soft:#E3F6F6;--anth:#2E3238;--bg:#F3F6F6;--surface:#FFFFFF;--line:#D3DEDE;--fg:#2E3238;--muted:#5F6B72;--bad:#B3261E;--bad-bg:#FDECEA;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;--body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif}
@media (prefers-color-scheme:dark){:root{--turq-ink:#5FD6D6;--turq-soft:#1D3436;--bg:#181C20;--surface:#22272C;--line:#3A4249;--fg:#E9EEEF;--muted:#9DA8AE;--bad:#FF8A80;--bad-bg:#3A1F1D;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--body)}
header{background:var(--anth);color:#fff;padding:calc(14px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
header .brand{display:flex;align-items:center;gap:8px;font:700 13px var(--body);letter-spacing:.08em;opacity:.85}
header .brand i{width:4px;height:16px;background:var(--turq);display:inline-block}
header h1{font:700 30px var(--display);margin:4px 0 0;letter-spacing:.01em}
main{max-width:560px;margin:0 auto;padding:12px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px));display:grid;gap:10px}
.day{font:800 12px var(--body);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-top:10px}
.day.today{color:var(--turq-ink)}
.mis{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--turq);border-radius:8px;padding:12px 14px;display:grid;gap:4px}
.mis.past{opacity:.7;border-left-color:var(--line)}
.slot{font:800 11px var(--body);letter-spacing:.06em;color:var(--turq-ink)}
.mis b{font-size:16px}
.addr{color:var(--muted);font-size:14px}
.txt{white-space:pre-wrap}
.note{color:var(--muted);font-size:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 16px;margin-top:6px;border-radius:8px;background:var(--turq);color:#fff;font:700 15px var(--body);text-decoration:none;justify-self:start;border:0;cursor:pointer}
.btn:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.ghost{background:transparent;color:var(--turq-ink);border:1px solid var(--turq)}
.box{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;display:grid;gap:8px}
.box.bad{background:var(--bad-bg);border-color:var(--bad)}
details summary{cursor:pointer;color:var(--muted);font-weight:700;padding:8px 0}
</style>
</head>
<body>
<header><div class="brand"><i></i>AFER · MES MISSIONS</div><h1 id="nom">Chargement…</h1></header>
<main id="m"><p class="note">Chargement de tes missions…</p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script>
const SB_URL="https://xgliespwrxlxiaqaxtzj.supabase.co",SB_KEY="sb_publishable_8UoZO8bXKkBgD47-wcLqCw_RlPkTslt";
const $m=document.getElementById("m"),$n=document.getElementById("nom");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const K=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const PK=k=>{const [y,m,d]=k.split("-").map(Number);return new Date(y,m-1,d)};
const today=()=>K(new Date());
const jourLong=k=>{const t=today(),dd=PK(k),dem=K(new Date(Date.now()+864e5));const s=dd.toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"});return (k===t?"Aujourd'hui · ":k===dem?"Demain · ":"")+s};
const CRN={m:"MATIN",a:"APRÈS-MIDI"};
const jeton=new URLSearchParams(location.search).get("o")||"";
function carte(x,past){
  const adr=[x.adresse,x.ville&&!String(x.adresse||"").includes(x.ville)?x.ville:""].filter(Boolean).join(", ");
  const btn=x.sdb?(x.k?`<a class="btn" href="index.html?k=${encodeURIComponent(x.k)}">Ouvrir le chantier (photos)</a>`:`<span class="note">Accès photo en préparation : réessaie dans une minute.</span>`):"";
  return `<div class="mis${past?" past":""}"><span class="slot">${x.c?CRN[x.c]:"JOURNÉE"}</span><b>${esc(x.nom)}</b>${adr?`<span class="addr">${esc(adr)}</span>`:""}${x.m?`<span class="txt">${esc(x.m)}</span>`:`<span class="note">Pas de mission écrite.</span>`}${btn}</div>`}
function afficher(d){
  $n.textContent=d.nom||"Mes missions";document.title=(d.nom?d.nom+" · ":"")+"Mes missions AFER";
  const t=today(),L=d.missions||[],par={};L.forEach(x=>{(par[x.d]=par[x.d]||[]).push(x)});
  const jours=Object.keys(par).sort(),avenir=jours.filter(k=>k>=t),passe=jours.filter(k=>k<t).reverse();
  const bloc=(k,past)=>`<div class="day${k===t?" today":""}">${esc(jourLong(k))}</div>`+par[k].map(x=>carte(x,past)).join("");
  let h=avenir.length?avenir.map(k=>bloc(k,false)).join(""):`<div class="box"><b>Aucune mission à venir</b><span class="note">AFER n'a rien prévu pour toi dans les 60 prochains jours. Cette page se met à jour toute seule.</span></div>`;
  if(passe.length)h+=`<details><summary>Jours passés (7 derniers jours)</summary>${passe.map(k=>bloc(k,true)).join("")}</details>`;
  h+=`<button class="btn ghost" id="rf" type="button">Actualiser</button>`;
  $m.innerHTML=h;document.getElementById("rf").onclick=charger}
function erreur(titre,txt,retry){$n.textContent="Mes missions";$m.innerHTML=`<div class="box${retry?"":" bad"}"><b>${esc(titre)}</b><span class="note">${esc(txt)}</span>${retry?`<button class="btn" type="button" onclick="charger()">Réessayer</button>`:""}</div>`}
let C=null;
async function charger(){
  if(!jeton)return erreur("Lien incomplet","Ouvre le lien complet envoyé par AFER.",false);
  if(!SB_URL)return erreur("Page non configurée","Cette page doit être publiée avec la configuration de l'appli.",false);
  if(!C)C=supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});
  const {data,error}=await C.rpc("espace_ouvrier",{p_jeton:jeton});
  if(error){if(/invalide ou désactivé/i.test(error.message||""))return erreur("Lien désactivé","Ce lien n'est plus valide. Demande un nouveau lien à AFER.",false);
    return erreur("Connexion impossible",navigator.onLine?"Le service ne répond pas. Réessaie dans un instant.":"Pas de connexion internet. Réessaie quand le réseau revient.",true)}
  afficher(data||{})}
charger();
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")charger()});
setInterval(()=>{if(document.visibilityState==="visible")charger()},120000);
</script>
</body>
</html>
