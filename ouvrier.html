<head>

<!-- Espace ouvrier (V16, 05/11/2026 ; grille de la semaine, maquette A) : un lien par personne (?o=…), créé dans Gestion > Personnel et matériel.
     Lit la fonction Supabase espace_ouvrier (supabase/complement-v16-ouvriers.sql) : ses jours du planning et les lignes idéal / limite de ses chantiers, sans aucun prix. -->
<style>
:root{--turq:#2FBFBF;--turq-ink:#178C8C;--turq-soft:#E3F6F6;--anth:#2E3238;--bg:#F3F6F6;--surface:#FFFFFF;--line:#D3DEDE;--fg:#2E3238;--muted:#5F6B72;--bad:#B3261E;--bad-bg:#FDECEA;

  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;--body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif}
@media (prefers-color-scheme:dark){:root{--turq-ink:#5FD6D6;--turq-soft:#1D3436;--bg:#181C20;--surface:#22272C;--line:#3A4249;--fg:#E9EEEF;--muted:#9DA8AE;--bad:#FF8A80;--bad-bg:#3A1F1D;--or:#F5A33B;--rg:#FF6B60;--we:#1D2226;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--body)}
header{background:var(--anth);color:#fff;padding:calc(12px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 14px max(16px,env(safe-area-inset-left,0px))}
header .brand{display:flex;align-items:center;gap:8px;font:700 12px var(--body);letter-spacing:.08em;opacity:.85}
header .brand i{width:4px;height:14px;background:var(--turq);display:inline-block}
header h1{font:700 28px var(--display);margin:2px 0 0;letter-spacing:.01em}
main{max-width:620px;margin:0 auto;padding:10px max(12px,env(safe-area-inset-right,0px)) 40px max(12px,env(safe-area-inset-left,0px));display:grid;gap:10px}
.wknav{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:800;font-size:15px}
.wknav .lab{display:grid}
.wknav .lab small{font-weight:600;color:var(--muted);font-size:12px}
.mini{all:unset;cursor:pointer;font:700 13px var(--body);border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px}
.mini:focus-visible,.blk:focus-visible,.btn:focus-visible{outline:2px solid var(--turq);outline-offset:2px}
.defile{position:relative;overflow-x:auto;overscroll-behavior-x:contain;scroll-snap-type:x proximity;border:1px solid var(--line);border-radius:10px;background:var(--surface);-webkit-overflow-scrolling:touch}
.grid{display:grid;width:max-content}
.hd{scroll-snap-align:start;font:800 11px var(--body);text-align:center;padding:4px 0 6px;border-bottom:1px solid var(--line);color:var(--muted);text-transform:uppercase}
.hd b{display:block;font-size:16px;color:var(--fg)}
.hd.t{background:var(--turq);color:#fff}.hd.t b{color:#fff}
.hd small{display:block;font-size:9.5px;letter-spacing:.04em;color:var(--turq-ink);min-height:12px}
.hd.t small{color:#fff}
.hd.lun,.col.lun{box-shadow:inset 2px 0 0 var(--line)}
.col{border-left:1px solid var(--line);display:grid;grid-template-rows:1fr 1fr;min-height:132px;position:relative}
.col.first{border-left:0}
.col.we{background:var(--we)}
.slot{padding:3px;display:flex;flex-direction:column;gap:3px;border-bottom:1px dashed var(--line);min-width:0}
.slot:last-child{border-bottom:0}
.blk{all:unset;cursor:pointer;flex:1;border-radius:5px;background:var(--cc);color:#fff;font:800 11px/1.15 var(--body);padding:4px 3px;display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden;word-break:break-word;min-height:26px}
.blk.sel{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--cc)}
.ln{position:absolute;top:0;bottom:0;right:-2px;width:0;z-index:2;pointer-events:none}
.ln.o{border-right:3px dashed var(--or)}.ln.r{border-right:3px solid var(--rg)}
.ln i{position:absolute;bottom:3px;right:-7px;width:11px;height:11px;border-radius:50%;background:var(--cc);border:2px solid var(--surface)}
.leg{display:grid;gap:6px}
.lg{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px}
.lg .sw{width:14px;height:14px;border-radius:4px;background:var(--cc);flex:none}
.pill{font:700 11.5px var(--body);border-radius:99px;padding:1px 8px;border:1px solid currentColor;white-space:nowrap}
.pill.o{color:var(--or)}.pill.r{color:var(--rg)}
.key{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.key span{display:flex;align-items:center;gap:5px}
.key i{display:inline-block;width:16px;height:0}
.det{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--cc);border-radius:10px;padding:12px 14px;display:grid;gap:4px}
.det .k{font:800 11px var(--body);letter-spacing:.06em;color:var(--turq-ink);text-transform:uppercase}
.det b{font-size:16px}
.addr{color:var(--muted);font-size:14px}
.txt{white-space:pre-wrap}
.note{color:var(--muted);font-size:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 16px;margin-top:6px;border-radius:8px;background:var(--turq);color:#fff;font:700 15px var(--body);text-decoration:none;justify-self:start;border:0;cursor:pointer}
.ghost{background:transparent;color:var(--turq-ink);border:1px solid var(--turq)}
.box{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;display:grid;gap:8px}
.box.bad{background:var(--bad-bg);border-color:var(--bad)}
/* V17 : dépenses véhicule (plein, péage, parking…) */
.ov{position:fixed;inset:0;z-index:20;background:var(--bg);overflow:auto;padding:calc(12px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.ov form{max-width:520px;margin:0 auto;display:grid;gap:12px}
.ov h2{font:700 26px var(--display);margin:0}
.typ{display:flex;gap:6px;flex-wrap:wrap}
.typ label{position:relative}
.typ input{position:absolute;opacity:0;inset:0}
.typ span{display:inline-block;border:1px solid var(--line);border-radius:99px;padding:9px 14px;font-weight:700;font-size:14px;background:var(--surface)}
.typ input:checked+span{background:var(--turq);border-color:var(--turq);color:#fff}
.typ input:focus-visible+span{outline:2px solid var(--turq);outline-offset:2px}
.shot{display:grid;gap:6px;justify-items:center;border:2px dashed var(--line);border-radius:12px;padding:16px;text-align:center;background:var(--surface);cursor:pointer;font-weight:700}
.shot img{max-height:180px;border-radius:8px}
.shot input{position:absolute;opacity:0;width:1px;height:1px}
.fl{display:grid;gap:4px;font-size:13px;color:var(--muted);font-weight:600}
.fl input,.fl select{font:600 16px var(--body);color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%;min-width:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lu{color:var(--turq-ink);font-size:13px;font-weight:700}
.err{color:var(--bad);font-weight:700;font-size:14px}
.deps{display:grid;gap:6px}
.dep{display:flex;justify-content:space-between;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:14px}
.dep small{display:block;color:var(--muted);font-size:12px}
</style>
</head>
<body>
<header><div class="brand"><i></i>AFER · MON PLANNING</div><h1 id="nom">Chargement…</h1></header>
<main id="m"><p class="note">Chargement de ton planning…</p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script>
const SB_URL="https://xgliespwrxlxiaqaxtzj.supabase.co",SB_KEY="sb_publishable_8UoZO8bXKkBgD47-wcLqCw_RlPkTslt";
const $m=document.getElementById("m"),$n=document.getElementById("nom");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const K=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const PK=k=>{const [y,m,d]=k.split("-").map(Number);return new Date(y,m-1,d)};
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};

const DN=["Dim","Lun","Mar","Mer","Jeu","Ven","Sam"];
const fcourt=k=>{const d=PK(k);return DN[d.getDay()].toLowerCase()+". "+d.getDate()+"/"+pad(d.getMonth()+1)};
const flong=k=>PK(k).toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"});
const CRN={m:"Matin",a:"Après-midi"};
// une couleur par chantier, la même que dans le planning de la gestion (même liste, même calcul)
const CH_COL=["#4F6D9A","#C0782E","#8A6BB0","#3E8E5E","#B5487A","#2E6F8E","#A3612A","#6B7F2E","#7A5C99","#B04A4A","#3F7F86","#8C6D1F"];
const chCol=id=>{let h=0;for(const c of String(id))h=(h*31+c.charCodeAt(0))>>>0;return CH_COL[h%CH_COL.length]};
// « Chantier chantier Paris 75005 » -> « Chantier Paris 75005 » ; nom court pour les cases
const propre=n=>String(n||"Chantier").replace(/^(chantier\s+)+/i,"Chantier ");
const court=n=>propre(n).replace(/^Chantier\s+/i,"").replace(/\s+\d{5}$/,"")||"Chantier";
const jeton=new URLSearchParams(location.search).get("o")||"";
let D=null,choix=null,vers=null,V=null;
function modele(d){
  const L=(d.missions||[]).map(x=>({...x,ch:x.ch||x.nom}));
  const CH={};(d.chantiers||[]).forEach(c=>CH[c.ch]={...c});

    if(c.limite&&c.ideal&&c.limite<c.ideal)c.limite=c.ideal;if(!c.limite&&c.ideal)c.limite=c.ideal});

// les jours défilent en continu : 5 semaines passées, 17 à venir ; le dimanche n'apparaît que s'il est travaillé
function jours(){const m=monday(new Date()),avecDim=D.L.some(x=>PK(x.d).getDay()===0),out=[];
  for(let d=addD(m,-35),e=addD(m,7*17-1);d<=e;d=addD(d,1))if(avecDim||d.getDay()!==0)out.push(K(d));return out}
function afficher(){
  const {L,CH}=D,t=today(),J=jours();

  const blk=x=>{const c=CH[x.ch];return `<button class="blk${x===choix?" sel":""}" style="--cc:${c.cc}" data-i="${L.indexOf(x)}" aria-label="${esc(flong(x.d)+", "+(x.c?CRN[x.c]:"journée")+" : "+c.nom)}">${esc(court(c.nom))}</button>`};
  let g=`<div class="grid" style="grid-template-columns:repeat(${J.length},var(--cw,60px))">`;
  g+=J.map(k=>{const d=PK(k),lun=d.getDay()===1;return `<div class="hd${k===t?" t":""}${lun?" lun":""}" data-k="${k}">${lun?`<small>S${isoWeek(d)}</small>`:"<small>&nbsp;</small>"}${DN[d.getDay()]}<b>${d.getDate()}</b></div>`}).join("");
  g+=J.map((k,i)=>{const d=PK(k),X=L.filter(x=>x.d===k);
    const slot=cr=>`<div class="slot">${X.filter(x=>!x.c||x.c===cr).map(blk).join("")}</div>`;
    // plusieurs lignes le même jour : décalées de 5 px pour rester visibles
    const LL=[];Object.values(CH).forEach(c=>{if(c.ideal===k)LL.push(["o",c,"date idéale"]);if(c.limite===k)LL.push(["r",c,"à ne pas dépasser"])});
    const lns=LL.map(([t,c,l],n)=>`<span class="ln ${t}" style="--cc:${c.cc};right:${-2+n*5}px" title="${esc(c.nom)} : ${l}"><i></i></span>`).join("");
    return `<div class="col${i===0?" first":""}${d.getDay()===1?" lun":""}${d.getDay()===0||d.getDay()===6?" we":""}">${slot("m")}${slot("a")}${lns}</div>`}).join("");
  g+=`</div>`;
  const key=`<div class="key"><span>Haut : matin</span><span>Bas : après-midi</span><span><i style="border-top:3px dashed var(--or)"></i>Date idéale</span><span><i style="border-top:3px solid var(--rg)"></i>À ne pas dépasser</span></div>`;
  const chs=Object.values(CH).sort((a,b)=>a.nom.localeCompare(b.nom));
  const leg=chs.length?`<div class="leg">${chs.map(c=>`<div class="lg" style="--cc:${c.cc}"><span class="sw"></span><b>${esc(c.nom)}</b>${c.ideal?`<span class="pill o">Idéal ${esc(fcourt(c.ideal))}</span>`:""}${c.limite?`<span class="pill r">Limite ${esc(fcourt(c.limite))}</span>`:""}</div>`).join("")}</div>`:"";
  let det="";
  if(choix){const c=CH[choix.ch];const adr=c.adresse||c.ville||"";
    const btn=c.sdb?(c.k?`<a class="btn" href="index.html?k=${encodeURIComponent(c.k)}">Ouvrir le chantier (photos)</a>`:`<span class="note">Accès photo en préparation : réessaie dans une minute.</span>`):"";
    det=`<div class="det" style="--cc:${c.cc}"><span class="k">${esc(flong(choix.d))} · ${choix.c?CRN[choix.c]:"journée"}</span><b>${esc(c.nom)}</b>${adr?`<span class="addr">${esc(adr)}</span>`:""}
      ${c.ideal||c.limite?`<div class="chips">${c.ideal?`<span class="pill o">Idéal ${esc(fcourt(c.ideal))}</span>`:""}${c.limite?`<span class="pill r">Limite ${esc(fcourt(c.limite))}</span>`:""}</div>`:""}
      ${choix.m?`<span class="txt">${esc(choix.m)}</span>`:`<span class="note">Pas de mission écrite.</span>`}${btn}</div>`}
  else det=`<div class="box"><b>Rien de prévu pour toi</b><span class="note">AFER n'a encore rien placé dans les prochaines semaines. La page se met à jour toute seule.</span></div>`;
  $m.innerHTML=`${V?`<button class="btn" type="button" data-dep>+ Dépense véhicule (plein, péage, parking)</button>`:""}<div class="wknav"><span class="lab" id="per"></span><button class="mini" data-auj type="button">Aujourd'hui</button></div>
    <div class="defile">${g}</div>${key}${leg}${det}${mesDeps()}<button class="btn ghost" id="rf" type="button">Actualiser</button>`;
  const sc=$m.querySelector(".defile");largeur(sc);
  if(gardeX!=null&&!vers)sc.scrollLeft=gardeX;else aller(sc,vers||K(monday(new Date())));vers=null;periode(sc)}
function largeur(sc){const n=innerWidth<520?6:innerWidth<900?9:12;sc.style.setProperty("--cw",Math.max(54,Math.floor(sc.clientWidth/n))+"px")}
function aller(sc,k){const h=sc.querySelector(`.hd[data-k="${k}"]`)||[...sc.querySelectorAll(".hd[data-k]")].find(x=>x.dataset.k>=k);if(h)sc.scrollLeft=h.offsetLeft}
function periode(sc){const hs=[...sc.querySelectorAll(".hd[data-k]")],h=hs.find(x=>x.offsetLeft+x.offsetWidth/2>=sc.scrollLeft)||hs[0];if(!h)return;const d=PK(h.dataset.k);
  document.getElementById("per").innerHTML=`Semaine ${isoWeek(d)}<small>${d.toLocaleDateString("fr-FR",{month:"long",year:"numeric"})}${K(monday(d))===K(monday(new Date()))?" · cette semaine":""}</small>`}
$m.addEventListener("scroll",e=>{if(e.target.classList&&e.target.classList.contains("defile"))periode(e.target)},true);
$m.addEventListener("click",e=>{if(e.target.closest("[data-auj]")){const sc=$m.querySelector(".defile");sc.scrollTo({left:(sc.querySelector(`.hd[data-k="${K(monday(new Date()))}"]`)||{offsetLeft:0}).offsetLeft,behavior:"smooth"});return}
  const b=e.target.closest("[data-i]");if(b){const sc=$m.querySelector(".defile"),x=sc.scrollLeft;choix=D.L[+b.dataset.i];afficher();$m.querySelector(".defile").scrollLeft=x;const d=$m.querySelector(".det");d&&d.scrollIntoView({behavior:"smooth",block:"nearest"});return}
  if(e.target.closest("[data-dep]"))return depOuvrir();
  if(e.target.closest("#rf"))charger()});
addEventListener("resize",()=>{const sc=$m.querySelector(".defile");if(!sc)return;const h=[...sc.querySelectorAll(".hd[data-k]")].find(x=>x.offsetLeft>=sc.scrollLeft);largeur(sc);if(h)aller(sc,h.dataset.k)});
function erreur(titre,txt,retry){$n.textContent="Mon planning";$m.innerHTML=`<div class="box${retry?"":" bad"}"><b>${esc(titre)}</b><span class="note">${esc(txt)}</span>${retry?`<button class="btn" type="button" onclick="charger()">Réessayer</button>`:""}</div>`}
let C=null;
async function charger(){
  if(!jeton)return erreur("Lien incomplet","Ouvre le lien complet envoyé par AFER.",false);
  if(!SB_URL)return erreur("Page non configurée","Cette page doit être publiée avec la configuration de l'appli.",false);

    return erreur("Connexion impossible",navigator.onLine?"Le service ne répond pas. Réessaie dans un instant.":"Pas de connexion internet. Réessaie quand le réseau revient.",true)}
  const old=choix&&D?{d:choix.d,c:choix.c,ch:choix.ch}:null;
  try{const r=await C.rpc("ouvrier_vehicules",{p_jeton:jeton});V=r.error?null:r.data}catch(e){V=null} // V17 : sans le SQL, pas de bouton
  D=modele(data||{});$n.textContent=D.nom||"Mon planning";document.title=(D.nom?D.nom+" · ":"")+"Mon planning AFER";
  choix=old?D.L.find(x=>x.d===old.d&&x.c===old.c&&x.ch===old.ch)||null:null;

/* ---------- V17 : dépenses véhicule (complement-v17-depenses-vehicules.sql, fonction lire-ticket) ---------- */
const TYPES=[["plein","Plein"],["peage","Péage"],["parking","Parking"],["lavage","Lavage"],["autre","Autre"]];
const TNOM=Object.fromEntries(TYPES);
const eur=n=>Number(n).toLocaleString("fr-FR",{minimumFractionDigits:2,maximumFractionDigits:2})+"\u00a0€";
const nb=v=>{const x=parseFloat(String(v??"").replace(/\s/g,"").replace(",","."));return isFinite(x)?x:null};
function mesDeps(){if(!V||!(V.depenses||[]).length)return"";const vn=id=>((V.vehicules||[]).find(v=>v.id===id)||{}).immat||id;
  return `<div class="deps"><b>Mes dernières dépenses</b>${V.depenses.slice(0,5).map(x=>`<div class="dep"><span>${esc(TNOM[x.type]||x.type)} · ${esc(vn(x.veh))}<small>${esc(fcourt(x.d))}${x.ch&&D.CH[x.ch]?" · "+esc(court(D.CH[x.ch].nom)):""}</small></span><b>${eur(x.montant)}</b></div>`).join("")}</div>`}
function depDefauts(){const t=V.auj||today(),miens=D.L.filter(x=>x.d===t).map(x=>x.ch);
  const j=(V.jour||[]).find(x=>miens.includes(x.ch)),h=(V.vehicules||[]).find(v=>v.habituel);
  return {veh:j?j.v:h?h.id:((V.vehicules||[])[0]||{}).id||"",ch:miens[0]||""}}
let PH=null,LU=false;
function depOuvrir(){const df=depDefauts(),t=V.auj||today();PH=null;LU=false;
  const chs=Object.values(D.CH).sort((a,b)=>a.nom.localeCompare(b.nom));
  const ov=document.createElement("div");ov.className="ov";ov.id="depf";
  ov.innerHTML=`<form novalidate><h2>Dépense véhicule</h2>
    <div class="typ" role="radiogroup" aria-label="Type de dépense">${TYPES.map(([k,l],i)=>`<label><input type="radio" name="t" value="${k}"${i===0?" checked":""}><span>${l}</span></label>`).join("")}</div>
    <label class="shot" for="dep-ph"><span id="dep-pv">Prendre le ticket en photo</span><small class="note">Le montant et les litres sont lus sur le ticket</small><input type="file" id="dep-ph" accept="image/*" capture="environment"></label>
    <div id="dep-lu" class="lu" aria-live="polite"></div>
    <div class="two"><label class="fl">Montant TTC (€)<input id="dep-m" inputmode="decimal" autocomplete="off"></label><label class="fl" id="dep-lw">Litres<input id="dep-l" inputmode="decimal" autocomplete="off"></label></div>
    <label class="fl">Kilométrage au compteur<input id="dep-k" inputmode="numeric" autocomplete="off" placeholder="ex. 98214"></label>
    <label class="fl">Véhicule<select id="dep-v">${(V.vehicules||[]).map(v=>`<option value="${esc(v.id)}"${v.id===df.veh?" selected":""}>${esc(v.nom)}${v.immat?" · "+esc(v.immat):""}</option>`).join("")}</select></label>
    <label class="fl">Chantier<select id="dep-c"><option value="">Aucun (trajet dépôt, bureau…)</option>${chs.map(c=>`<option value="${esc(c.ch)}"${c.ch===df.ch?" selected":""}>${esc(c.nom)}</option>`).join("")}</select></label>
    <label class="fl">Date<input type="date" id="dep-d" value="${esc(t)}" max="${esc(t)}"></label>
    <input type="hidden" id="dep-s">
    <div id="dep-e" class="err" aria-live="assertive"></div>
    <button class="btn" type="submit" id="dep-ok">Envoyer</button><button class="btn ghost" type="button" id="dep-x">Annuler</button></form>`;
  document.body.appendChild(ov);document.body.style.overflow="hidden";
  const f=ov.querySelector("form"),q=s=>ov.querySelector(s),litres=()=>{q("#dep-lw").hidden=f.t.value!=="plein"};litres();
  f.addEventListener("change",e=>{if(e.target.name==="t")litres()});
  q("#dep-x").onclick=depFermer;
  q("#dep-ph").onchange=async e=>{const fi=e.target.files&&e.target.files[0];if(!fi)return;q("#dep-e").textContent="";
    try{PH=await reduire(fi)}catch(x){PH=null;q("#dep-e").textContent="Photo illisible : reprends-la, ou saisis le montant à la main.";return}
    q("#dep-pv").innerHTML=`<img src="${PH}" alt="Ticket">`;q("#dep-lu").textContent="Lecture du ticket…";
    try{const r=await fetch(SB_URL+"/functions/v1/lire-ticket",{method:"POST",headers:{apikey:SB_KEY,authorization:"Bearer "+SB_KEY,"content-type":"application/json"},body:JSON.stringify({jeton,image:PH})});
      const j=await r.json().catch(()=>({}));const lu=j.lu;if(!r.ok||!lu||lu.type==="illisible")throw new Error(j.erreur||"non lu");
      if(lu.type&&TNOM[lu.type])f.t.value=lu.type;litres();
      if(lu.montant!=null)q("#dep-m").value=String(lu.montant).replace(".",",");if(lu.litres!=null)q("#dep-l").value=String(lu.litres).replace(".",",");
      if(lu.date&&/^\d{4}-\d{2}-\d{2}$/.test(lu.date)&&lu.date<=t)q("#dep-d").value=lu.date;q("#dep-s").value=lu.station||"";LU=true;
      q("#dep-lu").textContent="Lu sur le ticket : vérifie le montant"+(lu.litres!=null?" et les litres":"")+", puis ajoute le kilométrage."}
    catch(x){q("#dep-lu").textContent="Ticket non lu automatiquement : saisis le montant."}};
  f.onsubmit=async e=>{e.preventDefault();const m=nb(q("#dep-m").value),l=f.t.value==="plein"?nb(q("#dep-l").value):null,k=nb(q("#dep-k").value),er=q("#dep-e");
    if(m==null||m<=0)return er.textContent="Indique le montant du ticket.";
    if(!q("#dep-v").value)return er.textContent="Choisis le véhicule.";
    q("#dep-ok").disabled=true;er.textContent="";
    const {error}=await C.rpc("ouvrier_depense",{p_jeton:jeton,p_dep:{type:f.t.value,montant:m,litres:l,km:k,veh:q("#dep-v").value,ch:q("#dep-c").value,d:q("#dep-d").value,station:q("#dep-s").value,lu:LU,photo:PH}});
    q("#dep-ok").disabled=false;
    if(error)return er.textContent=navigator.onLine?"Pas envoyé : "+(error.message||"erreur")+".":"Pas de connexion : réessaie quand le réseau revient (la saisie reste ici).";
    depFermer();await charger();const b=$m.querySelector("[data-dep]");if(b){b.textContent="✓ Dépense envoyée · en ajouter une autre";setTimeout(()=>{if(b.isConnected)b.textContent="+ Dépense véhicule (plein, péage, parking)"},5000)}};
  q("#dep-m").focus({preventScroll:true})}
function depFermer(){const o=document.getElementById("depf");if(o)o.remove();document.body.style.overflow=""}
// photo réduite (1280 px, JPEG) : légère pour la base et pour la lecture
function reduire(fi){return new Promise((ok,ko)=>{const u=URL.createObjectURL(fi),im=new Image();
  im.onload=()=>{const r=Math.min(1,1280/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*r);c.height=Math.round(im.height*r);
    c.getContext("2d").drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);let d=c.toDataURL("image/jpeg",.72);if(d.length>850000)d=c.toDataURL("image/jpeg",.5);ok(d)};
  im.onerror=()=>{URL.revokeObjectURL(u);ko(new Error("illisible"))};im.src=u})}
charger();
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&!document.getElementById("depf"))charger()});
setInterval(()=>{if(document.visibilityState==="visible"&&!document.getElementById("depf"))charger()},120000);
</script>
</body>
