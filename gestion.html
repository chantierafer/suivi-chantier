<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2E3238">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Suivi AFER">
<title>Gestion AFER</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icone-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* Gestion AFER : espace AFER (maquette V4 validée le 21/10/2026).
   Menu à gauche (en haut sur téléphone), bandeau d'alertes permanent ; « Chantiers SDB » affiche l'appli SDB (index.html?sdb=1) dans un cadre.
   V12 (26/10/2026) : planning, rentabilité, personnel et matériel (copie des 2 Excel SharePoint), clients, synchronisation. */
:root{
  --turq:#2FBFBF; --turq-ink:#178C8C; --turq-soft:#E3F6F6; --anth:#2E3238;
  --bg:#F3F6F6; --surface:#FFFFFF; --surface-2:#F7FAFA; --line:#D3DEDE; --line-soft:#E6EEEE;
  --fg:#2E3238; --muted:#5F6B72;
  --warn:#B86E00; --warn-bg:#FFF4E0; --bad:#B3261E; --bad-bg:#FDECEA; --ok:#2E7D4F; --ok-bg:#E5F4EA;
  --side:#2E3238; --side-fg:#DCE4E6; --side-mute:#8F9BA2; --side-act:#3A4048;
  --row-ch:#2E3238; --row-ch-fg:#F1F5F5; --row-ph:#EAF0F0;
  --mo:#5B7FA6; --mat:#C08A2E; --veh:#8A6BB0; --stt:#6B6F76;
  --shadow:0 10px 30px rgba(20,30,35,.18);
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --turq-ink:#5FD6D6; --turq-soft:#1D3436;
  --bg:#181C20; --surface:#22272C; --surface-2:#1D2226; --line:#3A4249; --line-soft:#2E353B;
  --fg:#E9EEEF; --muted:#9DA8AE;
  --warn:#F2B04A; --warn-bg:#3A2E18; --bad:#FF8A80; --bad-bg:#3A1F1D; --ok:#7BD39A; --ok-bg:#1C3326;
  --side:#111417; --side-act:#262C32; --row-ch:#111417; --row-ph:#2A3036; --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --turq-ink:#5FD6D6; --turq-soft:#1D3436;
  --bg:#181C20; --surface:#22272C; --surface-2:#1D2226; --line:#3A4249; --line-soft:#2E353B;
  --fg:#E9EEEF; --muted:#9DA8AE;
  --warn:#F2B04A; --warn-bg:#3A2E18; --bad:#FF8A80; --bad-bg:#3A1F1D; --ok:#7BD39A; --ok-bg:#1C3326;
  --side:#111417; --side-act:#262C32; --row-ch:#111417; --row-ph:#2A3036; --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:14px/1.45 var(--body);overflow:hidden}
h1,h2,h3,h4{font-family:var(--display);font-weight:600;letter-spacing:.01em;text-wrap:balance;margin:0}
button{font-family:var(--body)}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--turq-ink);outline-offset:2px}
[hidden]{display:none!important}
a{color:var(--turq-ink)}

/* cadre */
.app{display:grid;grid-template-columns:212px minmax(0,1fr);height:100vh;height:100dvh}
.side{background:var(--side);color:var(--side-fg);padding:14px 10px calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:2px;font-size:14px;overflow-y:auto}
.side .brand{font-family:var(--display);font-size:24px;font-weight:700;color:#fff;padding:2px 10px 12px;letter-spacing:.03em;display:flex;align-items:center;gap:8px}
.side .brand i{width:9px;height:22px;background:var(--turq);display:inline-block}
.side .brand small{font:600 11px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--side-mute)}
.side .grp{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--side-mute);padding:14px 10px 4px}
.nav{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:8px;color:var(--side-fg);padding:8px 10px;border-radius:6px;cursor:pointer;min-height:38px}
.nav:hover{background:var(--side-act)}
.nav[aria-current="page"]{background:var(--side-act);color:#fff;box-shadow:inset 3px 0 0 var(--turq);font-weight:600}
.nav.dim{color:var(--side-mute);cursor:default}
.nav.dim:hover{background:none}
.nav .soon{margin-left:auto;font-size:10px;text-transform:uppercase;letter-spacing:.06em;border:1px solid #4A535B;border-radius:4px;padding:0 4px}
.side .foot{margin-top:auto;display:grid;gap:6px;padding:12px 10px 0;font-size:12px;color:var(--side-mute)}
.side .foot button{all:unset;cursor:pointer;color:var(--side-fg);text-decoration:underline;text-underline-offset:3px}
.live{display:inline-flex;align-items:center;gap:6px}
.live::before{content:"";width:8px;height:8px;border-radius:50%;background:#7BD39A}
.live.off::before{background:#F2B04A}
.main{position:relative;min-width:0;min-height:0;display:grid;grid-template-rows:auto minmax(0,1fr)}
.view{min-height:0;overflow-y:auto}
#v-sdb{overflow:hidden}
#v-sdb iframe{display:block;width:100%;height:100%;border:0;background:var(--bg)}
.page{max-width:1280px;margin:0 auto;padding:18px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px));display:grid;gap:16px;align-content:start;min-width:0}

/* bandeau d'alertes, visible partout */
.alerts{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);background:var(--surface-2);font-size:12.5px}
.alerts>b{font-size:12.5px;display:inline-flex;align-items:center;gap:6px}
.alerts>b span{background:var(--bad);color:#fff;border-radius:999px;font-size:11px;padding:0 6px}
.al{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 11px;background:var(--warn-bg);color:var(--warn);font-weight:600;font-size:12.5px}
.al.bad{background:var(--bad-bg);color:var(--bad)}
.al:focus-visible{outline:2px solid currentColor;outline-offset:2px}

/* éléments communs */
.topline{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px;justify-content:space-between}
.topline h2{font-size:30px}
.topline p{margin:2px 0 0;color:var(--muted);font-size:13px;max-width:80ch}
.tools{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.note{font-size:12.5px;color:var(--muted)}
.ph{color:var(--warn);font-style:italic}
.ph.dim{color:var(--muted)}
.btn{font:600 14px var(--body);border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:9px 14px;cursor:pointer;min-height:42px}
.btn.pri{background:var(--turq);border-color:var(--turq);color:#0E2A2A}
.btn.sm{min-height:32px;padding:5px 10px;font-size:12.5px;border-radius:6px}
.btn.xs{min-height:26px;padding:2px 8px;font-size:11.5px;border-radius:5px}
.btn.wide{width:100%}
.btn.dang{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:5px;font:12.5px var(--body);border-radius:999px;padding:4px 10px;background:var(--surface);border:1px solid var(--line);white-space:nowrap;cursor:pointer;color:var(--fg)}
.chip[aria-pressed="true"]{border-color:var(--cc,var(--turq));box-shadow:inset 0 0 0 1px var(--cc,var(--turq));font-weight:700}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.seg button{all:unset;cursor:pointer;padding:6px 12px;font-size:12.5px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--turq);color:#0E2A2A}
.dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--cc);display:inline-block}
.pill{font-size:11.5px;font-weight:700;border-radius:4px;padding:1px 7px;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.neu{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.hint{font-size:12px;color:var(--muted);margin:0}
.empty{border:1px dashed var(--line);border-radius:8px;padding:22px;text-align:center;color:var(--muted);background:var(--surface)}
.why{border-left:3px solid var(--turq);padding:9px 12px;background:var(--surface);border-radius:0 6px 6px 0;font-size:13px;display:grid;gap:3px}
.why b{font-family:var(--display);font-size:17px;font-weight:600}
.box{border:1px solid var(--line);border-radius:8px;padding:14px;background:var(--surface);display:grid;gap:8px}
.box.warn{border-color:var(--warn);background:var(--warn-bg)}
.box h3{font-size:20px}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line-soft);text-align:left;vertical-align:middle}
td{white-space:nowrap}
td.wrap{white-space:normal;min-width:180px}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:var(--surface-2);font-weight:700;white-space:nowrap}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr.clk{cursor:pointer} tr.clk:hover td{background:var(--turq-soft)} tr.sel td{background:var(--turq-soft)}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;border-bottom:1px dotted var(--line);padding:4px 0}
.kv span:first-child{color:var(--muted)}
.kv span:last-child{text-align:right;font-variant-numeric:tabular-nums;overflow-wrap:break-word}
.kv.tot{border-bottom:0;border-top:2px solid var(--fg);font-weight:700;padding-top:6px}
.sec{display:grid;gap:6px}
.sec>b{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--turq-ink)}
.lock{font-size:11px;color:var(--warn);text-transform:none;letter-spacing:0}

/* avatars */
.av{width:28px;height:28px;border-radius:50%;display:inline-grid;place-items:center;font:700 11px var(--body);color:#fff;background:var(--ac,#6b7a80);border:2px solid var(--surface);flex:none;margin-right:-6px}
.av.big{width:46px;height:46px;font-size:15px;margin:0}
.av.veh{background:var(--surface-2);color:var(--fg);border-color:var(--line)}
.av svg{width:60%;height:60%}
.avs{display:flex;align-items:center}
.avs .more{font-size:11px;color:var(--muted);margin-left:10px}
.pilot{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--muted)}
.pilot .av{width:20px;height:20px;font-size:8px;margin:0;border:0}

/* tableau de bord */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.kpi{border:1px solid var(--line);border-radius:8px;padding:12px 14px;background:var(--surface)}
.kpi .v{font-family:var(--display);font-size:34px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.kpi .l{font-size:12.5px;color:var(--muted);margin-top:4px}
.kpi.bad .v{color:var(--bad)}
.cgroup{display:grid;gap:10px}
.cgroup>header{display:flex;align-items:center;gap:8px;border-bottom:2px solid var(--cc);padding-bottom:5px;flex-wrap:wrap}
.cgroup>header h3{font-size:21px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px}
.card{all:unset;box-sizing:border-box;cursor:pointer;border:1px solid var(--line);border-radius:8px;padding:12px 13px;display:grid;gap:7px;background:var(--surface);border-left:5px solid var(--cc);align-content:start;position:relative}
.card:hover{border-color:var(--cc)}
.card:focus-visible{outline:2px solid var(--cc);outline-offset:2px}
.card.sel{box-shadow:0 0 0 2px var(--cc)}
.card.opp{border-style:dashed;border-left-style:solid}
.card .hd{display:flex;align-items:center;justify-content:space-between;gap:8px}
.card .code{font:700 12px var(--body);letter-spacing:.06em;color:var(--cc)}
.card h4{font-size:20px;display:flex;align-items:center;gap:8px}
.card .meta{font-size:12.5px;color:var(--muted)}
.card .foot{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:22px}
.eur{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--cc);color:var(--cc);font:700 12px var(--body);cursor:help;flex:none}
.eur:hover{background:var(--cc);color:#fff}
.pct{display:flex;align-items:center;gap:10px}
.pct .v{font:600 26px var(--display);font-variant-numeric:tabular-nums;min-width:60px}
.bar{height:8px;border-radius:4px;background:var(--line-soft);overflow:hidden;flex:1}
.bar i{display:block;height:100%;background:var(--cc,var(--turq));border-radius:4px}
.tags{display:flex;flex-wrap:wrap;gap:6px}

/* infobulle rentabilité */
.tip{position:fixed;z-index:30;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);padding:10px 12px;width:280px;display:grid;gap:6px;font-size:12.5px;pointer-events:none}
.tip b{font-family:var(--display);font-size:16px;font-weight:600}
.tip .kv{font-size:12.5px}
.mbar{display:flex;height:16px;border-radius:4px;overflow:hidden;background:var(--line-soft)}
.mbar span{display:block;height:100%}
.mbar.outline{border:1px dashed var(--muted);background:transparent}
.leg{display:flex;flex-wrap:wrap;gap:8px 12px;font-size:11.5px;color:var(--muted)}
.leg span{display:inline-flex;align-items:center;gap:4px}
.sw{width:12px;height:12px;border-radius:3px;display:inline-block;background:var(--cc)}

/* détail d'un chantier */
.scrim{position:fixed;inset:0;background:rgba(20,26,30,.35);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(470px,100%);background:var(--surface);border-left:1px solid var(--line);box-shadow:var(--shadow);padding:18px 18px calc(24px + env(safe-area-inset-bottom,0px));display:grid;gap:14px;align-content:start;overflow-y:auto;z-index:21;--cc:var(--turq)}
.drawer .x{position:absolute;top:12px;right:14px;min-height:36px;padding:6px 12px}
.drawer h3{font-size:28px;padding-right:90px}
.drawer .code{font:700 12px var(--body);letter-spacing:.06em;color:var(--cc)}
.row2{display:flex;gap:6px;flex-wrap:wrap}
.step{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line-soft);font-size:13.5px}
.step .st{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);display:inline-grid;place-items:center;font-size:11px;font-weight:700}
.step.done .st{background:var(--ok);border-color:var(--ok);color:#fff}
.step.cur .st{border-color:var(--cc);box-shadow:inset 0 0 0 3px var(--surface);background:var(--cc)}
.step .when{font-size:12px;color:var(--muted);text-align:right}
.step.cur span:nth-child(2){font-weight:700}
.pb{border:1px solid var(--line);border-left:4px solid var(--bad);border-radius:6px;padding:8px 10px;font-size:13px;display:grid;gap:2px}
.pb strong{font-weight:700}
.chip-res{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:2px 10px 2px 2px;font-size:12.5px;font-weight:600}
.chip-res .av{margin:0;width:24px;height:24px;border:0}

/* fenêtres (formulaires, choix) */
.pop{position:fixed;z-index:32;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:12px;display:grid;gap:9px;width:320px;max-width:calc(100vw - 16px);max-height:calc(100dvh - 16px);overflow-y:auto;font-size:13px}
.pop.modal{left:50%;top:50%;transform:translate(-50%,-50%);width:min(620px,calc(100vw - 16px))}
.pop h3{font-size:21px}
.pop label{display:grid;gap:3px;font-size:12px;color:var(--muted);font-weight:600}
.pop select,.pop textarea,.pop input:not([type=checkbox]):not([type=radio]){font:14px var(--body);color:var(--fg);background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:7px 8px;width:100%;min-width:0}
.pop .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pop .fgrp{border-top:1px solid var(--line-soft);padding-top:8px;display:grid;gap:8px}
.pop .fgrp>b{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--turq-ink)}
.pop .acts{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap;align-items:center}
.pop .acts .left{margin-right:auto}
.pop .list{display:grid;gap:3px;max-height:240px;overflow-y:auto}
.pop .list.cols{grid-template-columns:1fr 1fr;max-height:280px}
.pop .list .gh3{grid-column:1/-1;font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);padding-top:4px}
.pop .list button{all:unset;cursor:pointer;display:flex;align-items:center;gap:6px;padding:5px 6px;border-radius:5px}
.pop .list button:hover{background:var(--turq-soft)}
.pop .list .av{margin:0;border:0;width:22px;height:22px;font-size:9px}
.pop .chk{display:flex;flex-direction:row;align-items:center;gap:6px;color:var(--fg);font-weight:500;font-size:12.5px;padding:3px 4px;border-radius:5px;cursor:pointer}
.pop .chk:hover{background:var(--turq-soft)}
.pop .chk>span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pop .chk .note{font-size:10.5px;flex:none;margin-left:auto}
.pop .scope{display:flex;gap:10px;flex-wrap:wrap;font-size:12.5px}
.pop .inline{display:flex;gap:6px;align-items:end}
.pop .inline label{flex:1}
.pop .swatches{display:flex;gap:6px;flex-wrap:wrap}
.pop .swatches button{all:unset;cursor:pointer;width:26px;height:26px;border-radius:6px;background:var(--cc);border:2px solid transparent}
.pop .swatches button[aria-pressed="true"]{border-color:var(--fg)}
.pop .phase{display:grid;grid-template-columns:minmax(0,1.4fr) 1fr 1fr 70px 30px;gap:6px;align-items:end}
.mscrim{position:fixed;inset:0;background:rgba(20,26,30,.35);z-index:31}
.toast{position:fixed;z-index:40;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--anth);color:#fff;border-radius:8px;padding:10px 14px;font-size:13px;box-shadow:var(--shadow);max-width:min(560px,92vw)}

/* planning : ressources */
.tray{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:flex-start;border:1px dashed var(--line);border-radius:8px;padding:10px;background:var(--surface)}
.tray .tg{display:grid;gap:4px;min-width:0}
.tray .tg>span{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.tray .row{display:flex;flex-wrap:wrap;gap:6px}
.res{all:unset;cursor:grab;display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:2px 10px 2px 2px;font-size:12.5px;font-weight:600;max-width:240px}
.res>span.n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res .av{margin:0;width:26px;height:26px;border-width:0}
.res:active{cursor:grabbing}
.res.on{border-color:var(--turq);box-shadow:0 0 0 3px var(--turq-soft);background:var(--turq-soft)}
.res .cg{font-size:10px;font-weight:700;color:var(--warn);background:var(--warn-bg);border-radius:4px;padding:0 4px;flex:none}
.hintbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--turq-soft);border:1px solid var(--turq);border-radius:8px;padding:7px 12px;font-size:13px}
kbd{font:600 11px var(--body);background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:0 5px}
/* planning : grille */
.wk{display:grid;font-size:12.5px;user-select:none;-webkit-user-select:none}
.wk>div{border-bottom:1px solid var(--line-soft);border-right:1px solid var(--line-soft);padding:5px 6px;min-height:40px;min-width:0}
.wk .hd{background:var(--surface-2);font-weight:700;font-size:12px;text-align:center;position:sticky;top:0;z-index:1}
.wk .hd.today{background:var(--turq-soft);color:var(--turq-ink)}
.wk .hd small{display:block;font-weight:500;color:var(--muted)}

function etatSdb(r,code,cli){
  const E=EL[r.id]||{},f=r.fiche||{};
  const variante=((E.etat||{}).variant||{}).v||f.variante||"avec";
  const P={};Object.values(E.photo||{}).forEach(d=>{if(d&&d.slot)(P[d.slot]=P[d.slot]||[]).push(d.at)});Object.values(P).forEach(L=>L.sort());
  const steps=STEPS.filter(s=>!s.opt||variante==="avec").map(s=>{const L=P[s.id]||[];return {...s,n:L.length,done:L.length>=MIN,at:L.length>=MIN?L[MIN-1]:null}});
  const pct=steps.reduce((a,s)=>a+Math.min(s.n,MIN)/MIN,0)/steps.length*100;
  const curS=steps.findIndex(s=>!s.done);
  const pv=((E.pv||{}).pv||{}).v||null;
  const clos=((E.etat||{}).closed||{}).v||(r.clos?{}:null);
  const pbs=Object.values(E.pb||{}).filter(p=>p&&p.st!=="done").sort((a,b)=>String(b.at).localeCompare(String(a.at)));
  const photos=Object.values(P).reduce((a,L)=>a+L.length,0);
  const debut=(P.materiel||[])[0]||null;
  const dates=[...Object.values(P).flat(),...Object.values(E.pb||{}).map(p=>p&&p.at),pv&&pv.at,clos&&clos.at].filter(Boolean).sort();
  const statut=clos?"clos":pv?"pv":photos?"cours":"attente";
  const x={id:r.id,sdb:true,code,cli,nom:f.ville?"Chantier "+f.ville:"Nouveau chantier",cat:"SDB PMR",variante,steps,pct,cur:curS,pv,clos,pbs,photos,debut,
    fin0:(pv&&pv.at)||(clos&&clos.at)||null,derniere:dates[dates.length-1]||null,statut,cree:f.created||r.created_at};
  const g=gid("chantier",r.id)||{};
  const premier=dates[0]||null;
  x.deb=isK(g.deb)?g.deb:dayOf(debut||premier)||dayOf(x.cree);
  x.fin=isK(g.fin)?g.fin:x.fin0?dayOf(x.fin0):addWork(x.deb,1); // objectif : 2 jours par salle de bain
  if(x.fin<x.deb)x.fin=x.deb;
  x.pilote=g.pilote||null;x.av=pct;x.datesFixees=isK(g.deb);
  return x}
function chantiers(){const cm=clientsMap(),dmv=cm.dmv||{id:"dmv",...DEF_CLIENTS.dmv};
  const gen=Object.entries(gt("chantier")).filter(([id,d])=>!d.sdb&&d.nom&&!ROWS.some(r=>r.id===id));
  // codes SDB : ordre de création, en sautant les numéros déjà pris par un autre chantier du même client
  const pris=new Set(gen.map(([,d])=>d.code));let n=0;
  const L=ROWS.map(r=>{let code;do{n++;code=dmv.code+"-"+String(n).padStart(3,"0")}while(pris.has(code));return etatSdb(r,code,dmv)});
  gen.forEach(([id,d])=>{const cli=cm[d.client]||INCONNU,t=today();
    const ph=(d.phases||[]).filter(p=>p&&p.n);
    let av=num(d.av);if(av==null&&ph.length){const w=ph.map(p=>Math.max(1,workdays(p.deb,p.fin).length));av=ph.reduce((a,p,i)=>a+(num(p.av)||0)*w[i],0)/w.reduce((a,b)=>a+b,0)}

    L.push({id,sdb:false,code:d.code||cli.code+"-???",cli,nom:d.nom,cat:d.cat||"",ville:d.ville||"",deb:deb||today(),fin:fin||deb||today(),sansDates:!deb,pilote:d.pilote||null,av:av??0,avConnu:av!=null,
      phases:ph,statut,clos:d.clos?{at:d.closLe||null}:null,pbs:[],steps:[],photos:0,derniere:null,cree:d.cree||"",recette:num(d.recette),phaseEnCours:enCours,note:d.note||""})});

const imputeA=(txt,c)=>{const t=norm(txt);if(!t)return false;return t===norm(c.code)||t.includes(norm(c.code))||t===norm(c.nom)||(c.sdb&&t===norm(c.nom.replace(/^Chantier /,"")))};
function renta(c){const R=gid("renta",c.id)||{},E=EL[c.id]||{};
  // recette HT
  let recette=null,recNote="",attente=0;
  if(num(R.recette)!=null){recette=num(R.recette);recNote="saisie dans la rentabilité"}
  else if(c.sdb){const L=Object.values(E.devis||{}).filter(l=>l&&l.kind!=="titre"&&l.kind!=="soustotal");
    if(!L.length){recette=FORFAIT_SDB;recNote="forfait de base (devis pas encore ouvert)"}
    else{const q=l=>num(l.qty??l.q)||0;recette=L.filter(l=>l.st==="val").reduce((a,l)=>a+Math.round(q(l)*(num(l.pu)||0)*100)/100,0);attente=L.filter(l=>l.st==="att").reduce((a,l)=>a+q(l)*(num(l.pu)||0),0);
      recNote="devis : forfait + lignes validées par DOMetVIE"+(attente?" ("+eur(attente)+" en attente de validation)":"")}}
  else if(c.recette!=null){recette=c.recette;recNote="montant du chantier"}
  // main-d'œuvre : jours du planning × coût chargé
  const jours={};AFF.filter(a=>a.ch===c.id).forEach(a=>{jours[a.r]=(jours[a.r]||0)+1});
  const pers=Object.keys(jours).map(rs).filter(r=>r.t==="personne"),vehs=Object.keys(jours).map(rs).filter(r=>r.veh||r.tool);
  const moL=pers.map(r=>({r,j:jours[r.id],cj:coutJour(r)}));const moManque=moL.filter(x=>x.cj==null).map(x=>x.r.nom);
  const mo=!moL.length||moManque.length?null:moL.reduce((a,x)=>a+x.j*x.cj,0);
  // véhicules : carburant et entretien imputés (Excel), dépenses carburant et péage (appli SDB), coût fixe mensuel au prorata des jours
  const vehL=[];
  vehs.filter(r=>r.veh).forEach(r=>{const f=num(r.d["Coût fixe mensuel (€)"]);if(f!=null)vehL.push({l:`${r.nom} · ${plural(jours[r.id],"jour","jours")} × coût fixe ÷ 21,67`,v:f/21.67*jours[r.id]})});
  Object.values(gt("carburant")).filter(x=>imputeA(x["Chantier imputé"],c)).forEach(x=>{const v=num(x["Montant (€)"]);if(v!=null)vehL.push({l:"Plein du "+fkl(x.Date)+" · "+(x["Véhicule (immatriculation)"]||""),v})});
  Object.values(gt("entretien")).filter(x=>imputeA(x["Chantier imputé"],c)).forEach(x=>{const v=num(x["Montant (€)"]);if(v!=null)vehL.push({l:(x.Type||"Entretien")+" du "+fkl(x.Date),v})});
  const frais=Object.values(E.frais||{}).filter(x=>x&&num(x.amt)!=null);
  frais.filter(x=>/carburant|péage|peage|stationnement/i.test(x.cat||"")).forEach(x=>vehL.push({l:(x.cat||"Dépense")+" du "+fdl(x.at)+" (TTC)",v:num(x.amt)}));
  const vehSansCout=vehs.filter(r=>r.veh&&num(r.d["Coût fixe mensuel (€)"])==null).map(r=>r.nom);
  const veh=vehL.reduce((a,x)=>a+x.v,0);
  // matériaux et sous-traitance : saisis ; pour une SDB, le matériel est fourni par DOMetVIE (seules les petites dépenses de l'appli comptent)
  const matFrais=frais.filter(x=>!/carburant|péage|peage|stationnement/i.test(x.cat||""));
  let mat=num(R.mat),matNote="saisi";if(mat==null&&c.sdb){mat=matFrais.reduce((a,x)=>a+num(x.amt),0);matNote=matFrais.length?"petites dépenses de l'appli SDB (TTC)":"matériel fourni par DOMetVIE, aucune dépense saisie"}
  let st=num(R.st),stNote="saisie";if(st==null&&c.sdb){st=0;stNote="aucune sous-traitance saisie"}
  const autres=num(R.autres)||0;
  const manque=[];if(recette==null)manque.push("recette");if(mo==null)manque.push(moL.length?"coût chargé de "+moManque.join(", "):"équipe à affecter dans le planning");if(mat==null)manque.push("matériaux");if(st==null)manque.push("sous-traitance");
  const tot=manque.filter(m=>m!=="recette").length?null:mo+veh+mat+st+autres;
  const marge=recette!=null&&tot!=null?recette-tot:null;
  return {recette,recNote,attente,mo,moL,moManque,veh,vehL,vehSansCout,mat,matNote,matFrais,st,stNote,autres,tot,marge,manque,R}}
const pctM=x=>x.marge!=null&&x.recette?Math.round(x.marge/x.recette*100)+" %":"";
function segs(x){const s=(v,c)=>v&&x.recette?`<span style="width:${Math.max(0,Math.min(100,v/x.recette*100))}%;background:${c}"></span>`:"";return s(x.mo,"var(--mo)")+s(x.mat,"var(--mat)")+s(x.veh,"var(--veh)")+s(x.st+x.autres,"var(--stt)")+(x.marge>0?'<span style="flex:1;background:var(--ok)"></span>':"")}

  resList(r=>r.actif&&r.t==="personne").forEach(r=>{ech(r,"Titre de séjour : fin de validité","titre de séjour à renouveler",60);ech(r,"Visite médicale : prochaine","visite médicale",30)});
  resList(r=>r.actif&&r.veh).forEach(r=>{ech(r,"Contrôle technique : prochain","contrôle technique",30);ech(r,"Assurance : échéance","échéance d'assurance",30);ech(r,"Prochaine vidange : date","vidange",30);
    const km=num(r.d["Kilométrage (dernier relevé)"]),nx=num(r.d["Prochaine vidange : km"]);if(km!=null&&nx!=null&&km>=nx-1000)L.push({lvl:km>=nx?"bad":"warn",t:`${r.nom} : vidange à ${nx.toLocaleString("fr-FR")} km (compteur ${km.toLocaleString("fr-FR")} km)`,go:{res:r.id}})});
  resList(r=>r.actif&&r.tool).forEach(r=>ech(r,"Vérification périodique : prochaine","vérification périodique",30));
  CH.filter(x=>x.pbs.length).forEach(x=>L.push({lvl:"bad",t:`${x.nom} : ${plural(x.pbs.length,"problème à traiter","problèmes à traiter")}`,go:{pb:x.id}}));
  const av=resList(r=>/vérifier/i.test(r.d.Statut||""));if(av.length)L.push({lvl:"warn",t:plural(av.length,"fiche à vérifier","fiches à vérifier")+" (statut « À vérifier »)",go:{res:av[0].id}});
  const err=Object.values(gt("excel_ecrire")).filter(x=>x.erreur);if(err.length)L.push({lvl:"bad",t:plural(err.length,"modification n'est pas partie","modifications ne sont pas parties")+" dans l'Excel",go:{view:"sync"}});
  return L.sort((a,b)=>(a.lvl==="bad"?0:1)-(b.lvl==="bad"?0:1))}
let ALS=[];
function renderAlerts(){ALS=alertes();const el=$("#alerts");el.hidden=!ALS.length;if(!ALS.length){el.innerHTML="";return}

function week(cs){
  const mois=zoom==="mois",jour=zoom==="jour",t=today();

  const k0=K(cs[0]),k1=K(cs[cs.length-1]);
  const shown=CH.filter(c=>(c.fin>=k0&&c.deb<=k1)||AFF.some(a=>a.ch===c.id&&a.d>=k0&&a.d<=k1)).sort((a,b)=>a.deb.localeCompare(b.deb)||a.code.localeCompare(b.code));
  shown.forEach(c=>{const p=c.pilote?rs(c.pilote):null;
    h+=`<div class="bh" style="--cc:${c.cli.c}" data-chhead="${esc(c.id)}"><span class="dot"></span><span class="code">${esc(c.code)}</span><button class="nm" data-ch="${esc(c.id)}">${esc(c.nom)}</button><span style="font-weight:500;opacity:.75">· ${esc(c.cli.nom)}${c.cat?" · "+esc(c.cat):""} · ${fk(c.deb)} → ${fk(c.fin)}</span>
     <span class="right"><span class="eur" data-tip="${esc(c.id)}" aria-hidden="true">€</span>${c.sdb?`<button class="btn" data-open="${esc(c.id)}">Appli SDB</button>`:""}<button class="btn" data-editch="${esc(c.id)}">Dates</button><button class="pilot" data-pilot="${esc(c.id)}" title="Changer le pilote">${p?avatar(p)+"Pilote : "+esc(p.nom):"Choisir le pilote"}</button></span></div>`;
    [["eq","Équipe AFER"],["ext","Sous-traitants"],["veh","Véhicules et matériel"]].forEach(([row,lab])=>{
      h+=`<div class="lab">${lab}</div>`+cs.map(d=>{const kk=K(d),inCh=kk>=c.deb&&kk<=c.fin;
        const bl=active&&bloque(active,kk);

        return `<div class="cell ${mois?"month":""} ${isWE(d)?"we":""} ${bl?"blocked":""} ${inCh?"":"out"}" data-cell="${esc(c.id)}|${kk}" title="${bl?esc(rs(active).nom)+" absent ce jour ("+esc(bl.type)+")":inCh?"":"Hors période du chantier"}">${items.map(a=>{const r=rs(a.r);
          return `<button class="as ${clash(a.r,kk)?"clash":""} ${mois?"mini":""}" style="--cc:${c.cli.c}" data-aff="${esc(a.id)}" title="${esc(r.nom)}${a.m?" · "+esc(a.m):""}">${avatar(r)}${mois?"":`<span class="n">${esc(r.nom)}</span>`}${a.m&&!mois?'<span class="m"></span>':""}${jour&&a.m?`<span class="mis">${esc(a.m)}</span>`:""}</button>`}).join("")}</div>`}).join("")})});
  if(!shown.length)h+=`<div class="bh opp">Aucun chantier sur cette période</div>`;

  h+=`<div class="bh abs">Absences et congés<span class="right"><button class="btn" data-conge>+ Absence</button></span></div>`;
  if(!abs.length)h+=`<div class="lab" style="grid-column:1/-1">Aucune absence sur cette période</div>`;
  abs.forEach(r=>{h+=`<div class="lab">${avatar(r)}${esc(r.nom)}</div>`+cs.map(d=>{const a=absOn(r.id,K(d));return a?`<div class="cell off ${bloque(r.id,K(d))?"":"half"}" data-abs="${esc(a.id)}" title="${esc(a.type)} · ${esc(a.duree)}${a.attente?" · envoi vers l'Excel en cours":""}">${mois?"●":esc(a.type)}</div>`:`<div class="${isWE(d)?"we":""}"></div>`}).join("")});
  const opps=Object.entries(gt("opp")).map(([id,o])=>({id,...o})).filter(o=>!/perdu|transform/i.test(o.etat||""));
  if(opps.length)h+=`<div class="bh opp">Opportunités, non signées</div>`+opps.map(o=>`<div class="lab"><button class="nm" data-opp="${esc(o.id)}" style="all:unset;cursor:pointer;text-decoration:underline">${esc(o.nom)}</button></div>`+cs.map((d,i)=>`<div class="${isWE(d)?"we":""}">${i===0?(mois?`<span class="pill neu" title="${esc(o.etat||"")}">●</span>`:`<span class="pill neu">${esc(o.etat||"À chiffrer")}${isK(o.deb)?" · dès "+fk(o.deb):""}</span>`):""}</div>`).join("")).join("");
  return h}
function gRange(){
  if(gZoom==="jour"){const s=addD(monday(gCur),-7);return {s,e:addD(s,28),cols:range(28).map(i=>{const d=addD(s,i);return {d,l:DN[d.getDay()][0]+" "+d.getDate(),we:isWE(d)}})}}
  if(gZoom==="semaine"){const s=addD(monday(gCur),-14);return {s,e:addD(s,84),cols:range(12).map(i=>{const d=addD(s,i*7);return {d,l:"S"+isoWeek(d)}})}}
  const s=new Date(gCur.getFullYear(),gCur.getMonth()-1,1);return {s,e:new Date(s.getFullYear(),s.getMonth()+8,1),cols:range(8).map(i=>{const d=new Date(s.getFullYear(),s.getMonth()+i,1);return {d,l:MN[d.getMonth()]+" "+String(d.getFullYear()).slice(2)}})}}
function gShift(n){if(gZoom==="jour")gCur=addD(gCur,7*n);else if(gZoom==="semaine")gCur=addD(gCur,28*n);else gCur=new Date(gCur.getFullYear(),gCur.getMonth()+n,1)}
function gantt(){
  const {s,e,cols:gc}=gRange(),x=d=>(d-s)/(e-s)*100,ks=K(s),ke=K(addD(e,-1));
  const cw=i=>x(gc[i+1]?gc[i+1].d:e)-x(gc[i].d);
  const grid=gc.map((c,i)=>`${c.we?`<span class="wesh" style="left:${x(c.d)}%;width:${cw(i)}%"></span>`:""}<span class="wkl" style="left:${x(c.d)}%"></span>`).join("")+`<span class="today" style="left:${x(PK(today()))}%"></span>`;
  const bar=(a,b,cls="",inner="",st="")=>{const A=PK(a),B=addD(PK(b),1);return `<span class="b ${cls}" style="left:${Math.max(0,x(A))}%;width:${Math.max(.4,Math.min(100,x(B))-Math.max(0,x(A)))}%;${st}">${inner}</span>`};
  let h=`<div class="gh">Plan · ${gZoom==="jour"?"4 semaines":gZoom==="semaine"?"12 semaines":"8 mois"}</div><div class="gh">Dates</div><div class="gh">Av.</div><div class="gh tl"><div class="wkh">${gc.map((c,i)=>`<span style="left:${x(c.d)}%;width:${cw(i)}%">${c.l}</span>`).join("")}</div></div>`;
  const vis=CH.filter(c=>c.fin>=ks&&c.deb<=ke).sort((a,b)=>a.deb.localeCompare(b.deb));
  if(!vis.length)h+=`<div style="grid-column:1/-1" class="note">Aucun chantier sur cette période.</div>`;
  vis.forEach(c=>{const col=c.cli.c,p=c.pilote?rs(c.pilote):null;
    h+=`<div class="r-ch" data-chhead="${esc(c.id)}"><span class="dot" style="--cc:${col}"></span><button class="nm" data-ch="${esc(c.id)}">${esc(c.code)} · ${esc(c.nom)}</button><span style="margin-left:auto;font-weight:500;font-size:11.5px;opacity:.85;white-space:nowrap">${p?esc(p.nom):""}</span></div><div class="r-ch">${fk(c.deb)} → ${fk(c.fin)}</div><div class="r-ch">${c.sdb||c.avConnu?fpct(c.av)+"%":"—"}</div><div class="r-ch tl" style="--cc:${col}">${grid}${bar(c.deb,c.fin)}</div>`;
    const ph=c.sdb?[{n:"Travaux ("+c.steps.length+" étapes)",deb:c.deb,fin:c.fin,av:c.av}]:c.phases.filter(p=>isK(p.deb));
    ph.forEach(p=>{const av=num(p.av);h+=`<div class="r-ph" style="padding-left:24px">${esc(p.n)}</div><div class="r-ph">${fk(p.deb)} → ${fk(p.fin||p.deb)}</div><div class="r-ph">${av==null?"—":fpct(av)+"%"}</div><div class="r-ph tl" style="--cc:${col}">${grid}${bar(p.deb,isK(p.fin)?p.fin:p.deb,"pr",`<i style="width:${Math.min(100,av||0)}%"></i>`)}</div>`});
    team(c.id).filter(r=>rowOf(r)!=="veh").forEach(r=>{const L=AFF.filter(a=>a.ch===c.id&&a.r===r.id).map(a=>a.d).sort();if(!L.length)return;
      h+=`<div style="padding-left:24px">${avatar(r)}<span style="margin-left:8px">${esc(r.nom)}</span></div><div class="note">${plural(L.length,"jour","jours")}</div><div></div><div class="tl" style="--cc:${r.ac||"var(--muted)"}">${grid}${L.filter(k=>k>=ks&&k<=ke).map(k=>bar(k,k,"","","height:6px;opacity:.85")).join("")}</div>`})});
  const abs=ABS.filter(a=>a.fin>=ks&&a.deb<=ke);
  h+=`<div class="r-ph" style="grid-column:1/-1">Absences et congés</div>`;
  abs.forEach(a=>{const r=rs(a.r);h+=`<div style="padding-left:24px">${avatar(r)}<span style="margin-left:8px">${esc(r.nom)}</span> <span class="pill warn">${esc(a.type)}</span></div><div class="note">${fk(a.deb)} → ${fk(a.fin)}</div><div></div><div class="tl">${grid}${bar(a.deb,a.fin,"cg")}</div>`});
  if(!abs.length)h+=`<div style="grid-column:1/-1" class="note">Aucune absence sur cette période.</div>`;
  const opps=Object.entries(gt("opp")).map(([id,o])=>({id,...o})).filter(o=>!/perdu|transform/i.test(o.etat||"")&&isK(o.deb));
  h+=`<div class="r-ph" style="grid-column:1/-1">Opportunités</div>`;
  opps.forEach(o=>{h+=`<div style="font-style:italic"><button data-opp="${esc(o.id)}" style="all:unset;cursor:pointer">${esc(o.nom)}</button> <span class="pill neu">${esc(o.etat||"À chiffrer")}</span></div><div class="note">${fk(o.deb)} → ${fk(o.fin||o.deb)}</div><div></div><div class="tl">${grid}${bar(o.deb,isK(o.fin)?o.fin:o.deb,"op")}</div>`});
  if(!opps.length)h+=`<div style="grid-column:1/-1" class="note">Aucune opportunité datée.</div>`;
  return h}

function assignRows(r,ch,days,m){const rows=[],skip=[];days.forEach(k=>{if(bloque(r,k)){skip.push(k);return}const id=affId(r,ch,k);if(gid("aff",id))return;rows.push({type:"aff",id,data:{r,ch,d:k,...(m?{m}:{})}})});return {rows,skip}}
function joursChantier(c){const L=workdays(c.deb,c.fin);return L.length?L:[c.deb]}
function assignAll(r,chId){const c=CHI[chId];if(!c)return;const {rows,skip}=assignRows(r,chId,joursChantier(c));
  gputMany(rows);toast(`${rs(r).nom} : ${plural(rows.length,"jour ajouté","jours ajoutés")} sur ${c.nom} (${fk(c.deb)} → ${fk(c.fin)})${skip.length?`, ${plural(skip.length,"jour d'absence évité","jours d'absence évités")}`:""}.`)}
function toggleDay(r,chId,k){const id=affId(r,chId,k);
  if(gid("aff",id)){gdelMany("aff",[id]);toast(`${rs(r).nom} retiré du ${fk(k)}.`);return}
  const b=bloque(r,k);if(b){toast(`${rs(r).nom} est absent le ${fk(k)} (${b.type.toLowerCase()}) : impossible de l'affecter.`);return}
  gputMany([{type:"aff",id,data:{r,ch:chId,d:k}}]);toast(`${rs(r).nom} ajouté le ${fk(k)} seulement.`)}
function groupOf(a){const set=new Set(AFF.filter(x=>x.r===a.r&&x.ch===a.ch).map(x=>x.d));const g=[a.d];
  for(let d=addD(PK(a.d),-1);;d=addD(d,-1)){if(isWE(d))continue;const k=K(d);if(set.has(k))g.unshift(k);else break}
  for(let d=addD(PK(a.d),1);;d=addD(d,1)){if(isWE(d))continue;const k=K(d);if(set.has(k))g.push(k);else break}
  return g}

  if(!frame){frame=document.createElement("iframe");frame.title="Chantiers SDB";frame.allow="clipboard-write; fullscreen";
    frame.src="./?sdb=1"+(ch?"&ch="+encodeURIComponent(ch):"");$("#v-sdb").appendChild(frame)}
  else if(ch){if(frameReady)frame.contentWindow.postMessage({gestion:"ouvrir",ch,tab:"suivi"},location.origin);else pending=ch}
  history.replaceState(null,"","#sdb"+(ch?"="+encodeURIComponent(ch):""));setView("sdb")}
addEventListener("message",e=>{if(e.origin!==location.origin||!e.data||e.data.gestion!=="pret")return;frameReady=true;
  if(pending){frame.contentWindow.postMessage({gestion:"ouvrir",ch:pending,tab:"suivi"},location.origin);pending=null}});
function goPlanChantier(id){const c=CHI[id];if(!c)return;planMode="sem";zoom="semaine";const t=today();cur=t>=c.deb&&t<=c.fin?new Date():PK(c.deb);SEL=null;$("#detail").innerHTML="";go("plan")}
function closeDetail(){const id=SEL;SEL=null;$("#detail").innerHTML="";RENDER();const c=document.querySelector(`.card[data-ch="${CSS.escape(id||"")}"]`);c&&c.focus()}

document.addEventListener("click",e=>{const t=e.target;
  if(justSel)return;
  if(popEl&&!popEl.contains(t)&&!t.closest("[data-aff],[data-pilot],[data-conge],[data-cell],[data-abs]"))closeFloat();
  if(popEl&&popEl.contains(t)&&!t.closest("[data-view]"))return;
  const q=s=>t.closest(s);let el;
  if(el=q("[data-al]")){const a=ALS[+el.dataset.al];if(!a)return;if(a.go.pb)openSdb(a.go.pb);else if(a.go.res){const r=RES[a.go.res];if(r){resTab=r.veh?"vehicule":r.tool?"materiel":r.grp==="bureau"?"bureau":"chantier";selRes=r.id;if(!r.actif)voirSortis=true}go("res")}else if(a.go.view)go(a.go.view);return}
  if(el=q("[data-view]")){closeFloat();go(el.dataset.view);return}
  if(el=q("[data-open]")){openSdb(el.dataset.open);return}
  if(el=q("[data-pb]")){openSdb(el.dataset.pb);return}
  if(q("#detail [data-close]")){closeDetail();return}
  if(el=q("[data-goplan]")){goPlanChantier(el.dataset.goplan);return}
  if(el=q("[data-gorenta]")){selRenta=el.dataset.gorenta;SEL=null;$("#detail").innerHTML="";go("renta");return}
  if(el=q("[data-editch]")){chantierPop(el.dataset.editch);return}
  if(q("[data-newch]")){chantierPop(null);return}
  if(q("[data-newopp]")){oppPop(null);return}
  if(el=q("[data-opp]")){oppPop(el.dataset.opp);return}
  if(el=q("[data-pilot]")){pilotPop(el.dataset.pilot,el);return}
  if(el=q("[data-conge]")){congePop(el,el.dataset.conge||null);return}
  if(el=q("[data-abs]")){absPop(el.dataset.abs,el);return}
  if(el=q("[data-goplanres]")){planMode="sem";active=el.dataset.goplanres;go("plan");toast(rs(active).nom+" sélectionné : clique un chantier (tous ses jours) ou double-clique une case (un jour).");return}
  if(el=q("[data-cf]")){cliFilter=el.dataset.cf;RENDER();return}
  if(el=q("[data-cf2]")){if(q("[data-editcli]"))return cliPop(q("[data-editcli]").dataset.editcli);cliFilter=el.dataset.cf2;go("dash");return}
  if(el=q("[data-editcli]")){cliPop(el.dataset.editcli);return}
  if(q("[data-newcli]")){if(!needBase())cliPop(null);return}
  if(el=q("[data-pm]")){planMode=el.dataset.pm;RENDER();return}
  if(el=q("[data-zoom]")){if(planMode==="sem")zoom=el.dataset.zoom;else gZoom=el.dataset.zoom;if(zoom==="jour")while(isWE(cur))cur=addD(cur,1);RENDER();return}
  if(el=q("[data-nav]")){const n=+el.dataset.nav;if(planMode==="sem"){if(n===0)cur=new Date();else shift(n)}else{if(n===0)gCur=new Date();else gShift(n)}RENDER();return}
  if(el=q("[data-rt]")){resTab=el.dataset.rt;selRes=null;RENDER();return}
  if(el=q("[data-sortis]")){voirSortis=el.checked;RENDER();return}
  if(el=q("[data-rs]")){selRes=el.dataset.rs;RENDER();if(innerWidth<1100){const f=$("#fiche");f&&f.scrollIntoView({behavior:"smooth",block:"start"})}return}
  if(el=q("[data-editfiche]")){const r=RES[el.dataset.editfiche];if(r)fichePop(r.t,r.id);return}
  if(el=q("[data-addfiche]")){fichePop(el.dataset.addfiche,null);return}
  if(el=q("[data-renta]")){selRenta=selRenta===el.dataset.renta?null:el.dataset.renta;RENDER();return}
  if(q("[data-syncnow]")){gput("excel_demande","maintenant",{at:new Date().toISOString()}).then(ok=>ok&&toast("Demande envoyée : les Excel sont relus dans quelques secondes."));return}
  if(q("[data-unsel]")){active=null;RENDER();return}
  if(el=q("[data-res]")){active=active===el.dataset.res?null:el.dataset.res;RENDER();return}
  if(el=q("[data-aff]")){groupPop(el.dataset.aff,el);return}
  if((el=q("[data-chhead]"))&&active&&!q(".eur,[data-pilot],[data-open],[data-editch],.nm")){assignAll(active,el.dataset.chhead);return}
  if((el=q("[data-cell]"))&&active){const [chId]=el.dataset.cell.split("|");if(clickTimer)return;clickTimer=setTimeout(()=>{clickTimer=null;assignAll(active,chId)},280);return}
  if(el=q("[data-ch]")){SEL=el.dataset.ch;RENDER();return}
});
document.addEventListener("change",e=>{const i=e.target.closest("[data-rk]");if(!i)return;const id=i.dataset.rch,R={...(gid("renta",id)||{})};const v=num(i.value);if(v==null)delete R[i.dataset.rk];else R[i.dataset.rk]=v;needRender=false;gput("renta",id,R)});
document.addEventListener("focusout",e=>{if(e.target.closest&&e.target.closest("[data-rk]")&&needRender){needRender=false;setTimeout(RENDER,0)}});
document.addEventListener("mousedown",e=>{if(e.button!==0||active||VIEW!=="plan")return;const cell=e.target.closest("[data-cell]");if(!cell||e.target.closest("[data-aff]"))return;const [chId,k]=cell.dataset.cell.split("|");closeFloat();drag=(e.shiftKey&&sel&&sel.ch===chId)?{ch:chId,k0:sel.k0,k1:k}:{ch:chId,k0:k,k1:k};sel=null;paintSel();e.preventDefault()});
document.addEventListener("mouseover",e=>{if(drag){const cell=e.target.closest("[data-cell]");if(cell){const [chId,k]=cell.dataset.cell.split("|");if(chId===drag.ch&&drag.k1!==k){drag.k1=k;paintSel()}}}
  const t=e.target.closest("[data-tip]");if(t)showTip(t,t.dataset.tip)});
document.addEventListener("mouseout",e=>{if(e.target.closest("[data-tip]"))hideTip()});
document.addEventListener("mouseup",()=>{if(!drag)return;const d=drag;drag=null;const [a,b]=[d.k0,d.k1].sort();sel={ch:d.ch,k0:a,k1:b};paintSel();const anchor=document.querySelector(`[data-cell="${CSS.escape(d.ch+"|"+b)}"]`);if(anchor)selPop(anchor);justSel=true;setTimeout(()=>{justSel=false},0)});
document.addEventListener("dblclick",e=>{const cell=e.target.closest("[data-cell]");if(cell&&active){clearTimeout(clickTimer);clickTimer=null;const [chId,k]=cell.dataset.cell.split("|");toggleDay(active,chId,k)}});
document.addEventListener("dragstart",e=>{const b=e.target.closest&&e.target.closest("[data-res]");if(!b)return;e.dataTransfer.setData("text/plain",b.dataset.res);e.dataTransfer.effectAllowed="copy"});
document.addEventListener("dragover",e=>{const c=e.target.closest&&e.target.closest("[data-cell]");if(!c)return;e.preventDefault();document.querySelectorAll(".cell.drop").forEach(x=>x!==c&&x.classList.remove("drop"));c.classList.add("drop")});
document.addEventListener("dragleave",e=>{const c=e.target.closest&&e.target.closest("[data-cell]");if(c)c.classList.remove("drop")});
document.addEventListener("drop",e=>{const c=e.target.closest&&e.target.closest("[data-cell]");if(!c)return;e.preventDefault();c.classList.remove("drop");const rid=e.dataTransfer.getData("text/plain"),[chId,k]=c.dataset.cell.split("|");
  if(!RES[rid])return;const b=bloque(rid,k);if(b){toast(`${rs(rid).nom} est absent le ${fk(k)} (${b.type.toLowerCase()}).`);return}const id=affId(rid,chId,k);if(gid("aff",id))return;
  gputMany([{type:"aff",id,data:{r:rid,ch:chId,d:k}}]);toast(`${rs(rid).nom} affecté à ${(CHI[chId]||{}).nom} le ${fk(k)}. Touche l'étiquette pour écrire sa mission.`)});
document.addEventListener("contextmenu",e=>{const t=e.target.closest(".card[data-ch],[data-chhead]");if(!t)return;const id=t.dataset.ch||t.dataset.chhead,c=CHI[id];if(!c||!c.sdb)return;e.preventDefault();openSdb(id)});
document.addEventListener("keydown",e=>{if(e.key!=="Escape")return;if(popEl){closeFloat();return}if(active){active=null;RENDER();return}if(SEL)closeDetail()});
addEventListener("resize",()=>{hideTip()});
addEventListener("hashchange",()=>{if(C&&gate.hidden)route(location.hash.slice(1))}); // lien collé ou favori #plan, #res…
$("#out").onclick=async()=>{await C.auth.signOut().catch(()=>{});location.replace(location.pathname)};
if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});
start();
</script>
